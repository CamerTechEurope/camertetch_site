name: 🐛 Bug report
description: Report a reproducible problem with the website
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: checkboxes
    attributes:
      label: Before reporting
      description: |
        Please search existing issues first, and make sure this is **not** a security
        vulnerability — those must be reported privately (see [SECURITY.md](../blob/main/SECURITY.md)).
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Where did the problem occur?
      placeholder: https://ourdomain.com/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include error messages if any.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Scroll to ...
        4. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and device
      placeholder: Chrome 140 on Android 15 / Safari 19 on macOS
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
        - Not applicable
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context
      description: Drag and drop images here, or add anything else that helps.
