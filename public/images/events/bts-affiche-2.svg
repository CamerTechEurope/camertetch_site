<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1000' width='800' height='1000'>
  <defs>
    <linearGradient id='bgGrad2' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0a5234'/>
      <stop offset='60%' stop-color='#084129'/>
      <stop offset='100%' stop-color='#042215'/>
    </linearGradient>
  </defs>
  
  <rect width='800' height='1000' fill='url(#bgGrad2)'/>
  
  <!-- Header -->
  <g transform='translate(60, 50)'>
    <text x='0' y='30' font-family='system-ui, sans-serif' font-size='20' font-weight='800' fill='#ffffff'>Camer'Tech Europe</text>
    <rect x='520' y='0' width='160' height='42' rx='8' fill='#111827' stroke='#f5a623' stroke-width='1.5'/>
    <text x='600' y='26' text-anchor='middle' font-family='Impact, sans-serif' font-size='18' font-weight='900' fill='#ffffff'>BACK TO SCHOOL</text>
  </g>
  
  <!-- Main Title -->
  <text x='60' y='180' font-family='system-ui, sans-serif' font-size='56' font-weight='900' fill='#f5a623' letter-spacing='-1'>NOUVEAU</text>
  <text x='60' y='245' font-family='system-ui, sans-serif' font-size='56' font-weight='900' fill='#ffffff' letter-spacing='-1'>EN FRANCE ?</text>
  
  <text x='60' y='295' font-family='system-ui, sans-serif' font-size='20' font-weight='500' fill='#d1fae5'>
    Viens rencontrer une communauté qui comprend tes défis.
  </text>
  
  <!-- Box Checklist -->
  <g transform='translate(60, 340)'>
    <rect width='680' height='320' rx='16' fill='#ffffff'/>
    <rect x='0' y='0' width='12' height='320' fill='#f5a623' rx='4'/>
    
    <text x='40' y='50' font-family='system-ui, sans-serif' font-size='18' font-weight='800' fill='#111827'>
      Le Back to School Camer'Tech, c'est l'occasion de :
    </text>
    
    <g transform='translate(40, 90)'>
      <circle cx='10' cy='10' r='5' fill='#0a5234'/>
      <text x='30' y='16' font-family='system-ui, sans-serif' font-size='16' font-weight='600' fill='#374151'>Rencontrer d'autres étudiants et jeunes professionnels</text>
      
      <circle cx='10' cy='60' r='5' fill='#0a5234'/>
      <text x='30' y='66' font-family='system-ui, sans-serif' font-size='16' font-weight='600' fill='#374151'>Obtenir des conseils pratiques pour réussir ton intégration</text>
      
      <circle cx='10' cy='110' r='5' fill='#0a5234'/>
      <text x='30' y='116' font-family='system-ui, sans-serif' font-size='16' font-weight='600' fill='#374151'>Développer ton premier réseau professionnel en France</text>
      
      <circle cx='10' cy='160' r='5' fill='#0a5234'/>
      <text x='30' y='166' font-family='system-ui, sans-serif' font-size='16' font-weight='600' fill='#374151'>Partager un moment convivial autour d'une partie de bowling</text>
    </g>
  </g>
  
  <!-- 2 Villes -->
  <g transform='translate(60, 700)'>
    <rect width='325' height='140' rx='14' fill='rgba(255,255,255,0.08)' stroke='rgba(255,255,255,0.15)'/>
    <text x='25' y='45' font-family='system-ui, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>Paris</text>
    <text x='25' y='75' font-family='system-ui, sans-serif' font-size='14' font-weight='500' fill='rgba(255,255,255,0.7)'>Balade découverte &amp; Bowling</text>
    <text x='25' y='105' font-family='system-ui, sans-serif' font-size='13' font-weight='700' fill='#f5a623'>Samedi 24 Octobre 2026</text>
    
    <rect x='355' y='0' width='325' height='140' rx='14' fill='rgba(255,255,255,0.08)' stroke='rgba(255,255,255,0.15)'/>
    <text x='380' y='45' font-family='system-ui, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>Lyon</text>
    <text x='380' y='75' font-family='system-ui, sans-serif' font-size='14' font-weight='500' fill='rgba(255,255,255,0.7)'>Balade découverte &amp; Bowling</text>
    <text x='380' y='105' font-family='system-ui, sans-serif' font-size='13' font-weight='700' fill='#f5a623'>Samedi 24 Octobre 2026</text>
  </g>
  
  <!-- Footer -->
  <rect y='880' width='800' height='120' fill='#02140c'/>
  <g transform='translate(60, 910)'>
    <text x='0' y='24' font-family='system-ui, sans-serif' font-size='16' font-weight='700' fill='#ffffff'>Réserve ta place : linktr.ee/CamerTechEurope</text>
    <text x='0' y='50' font-family='system-ui, sans-serif' font-size='13' font-weight='500' fill='rgba(255,255,255,0.6)'>Infoline : 06 67 78 82 86 / 06 24 47 86 80</text>
  </g>
</svg>